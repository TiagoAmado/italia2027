<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#A8552E">
<link rel="manifest" href="manifest.json">
<title>Lua de Mel — Itália · Roteiro</title>
<script>
(function(){
  try{
    var pref = localStorage.getItem('themeMode') || 'auto';
    var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var effective = pref==='auto' ? (sysDark ? 'dark' : 'light') : pref;
    document.documentElement.setAttribute('data-theme', effective);
  }catch(err){ document.documentElement.setAttribute('data-theme','light'); }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="top">
    <div class="sub">Lua de Mel</div>
    <h1>Roteiro — Itália</h1>
    <div class="route">
      <span>Roma</span><span class="dot">→</span><span>Sorrento</span><span class="dot">→</span><span>Florença</span><span class="dot">→</span><span>Bologna</span><span class="dot">→</span><span>Veneza</span><span class="dot">→</span><span>Roma</span>
    </div>
  </header>

  <div class="viewtoggle">
    <button id="btnByDay" class="active">Por dia</button>
    <button id="btnSummary">Resumo</button>
    <button id="themeToggle" title="Alternar tema"></button>
  </div>

  <nav class="days" id="dayNav"></nav>

  <main class="day" id="dayView"></main>

  <div class="legend">
    <span><i style="background:#A8552E"></i>Roma</span>
    <span><i style="background:#2A6F63"></i>Sorrento</span>
    <span><i style="background:#B8862E"></i>Florença</span>
    <span><i style="background:#9E2B25"></i>Bologna</span>
    <span><i style="background:#C8102E"></i>Ferrari Day</span>
    <span><i style="background:#1D5C64"></i>Veneza</span>
  </div>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
