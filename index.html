<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Lua de Mel — Itália · Roteiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EF;
    --paper-raised:#FFFFFF;
    --paper-sunken:#FAF6EF;
    --ink:#2B2420;
    --ink-soft:#6B5F52;
    --line: rgba(43,36,32,0.14);
    --line-strong: rgba(43,36,32,0.28);
    --accent:#A8552E;
    --accent-soft:#A8552E1a;
    --accent-2:#A8552E33;
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --paper:#17181A;
      --paper-raised:#1E1F22;
      --paper-sunken:#121314;
      --ink:#E8E6E2;
      --ink-soft:#9B9994;
      --line: rgba(232,230,226,0.12);
      --line-strong: rgba(232,230,226,0.24);
      --accent:#D97B4F;
      --accent-soft:#D97B4F1a;
      --accent-2:#D97B4F33;
    }
    .item .body .flag{color:#F0C4A8; background:#3A2A20;}
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .app{max-width:760px; margin:0 auto; padding:0 0 60px;}

  header.top{
    padding:28px 20px 18px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--paper) 0%, var(--paper) 100%);
    position:sticky; top:0; z-index:5;
  }
  header.top h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(24px, 6vw, 34px);
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  header.top .sub{
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-weight:500;
  }
  header.top .route{
    margin-top:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink);
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    align-items:center;
  }
  header.top .route span.dot{color:var(--ink-soft);}

  .viewtoggle{
    display:flex;
    gap:6px;
    padding:12px 16px 0;
    justify-content:center;
  }
  .viewtoggle button{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:.03em;
    text-transform:uppercase;
    font-weight:600;
    padding:7px 16px;
    border-radius:20px;
    border:1px solid var(--line-strong);
    background:var(--paper-raised);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .viewtoggle button.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .viewtoggle button:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}

  nav.days{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:14px 16px;
    -webkit-overflow-scrolling:touch;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    position:sticky;
    top:96px;
    z-index:4;
    scrollbar-width:thin;
  }
  nav.days::-webkit-scrollbar{height:5px;}
  nav.days::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:10px;}

  .stub{
    flex:0 0 auto;
    width:58px;
    padding:8px 4px 10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    text-align:center;
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    position:relative;
    transition: border-color .15s ease, transform .15s ease;
  }
  .stub:hover{transform:translateY(-2px);}
  .stub:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .stub .dnum{font-size:16px; font-weight:600; line-height:1.1;}
  .stub .dwk{font-size:9px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em; margin-top:2px;}
  .stub .cdot{width:6px; height:6px; border-radius:50%; margin:6px auto 0; background:var(--accent-city, var(--ink-soft));}
  .stub.active{
    border-color: var(--accent-city, var(--ink));
    background: var(--accent-city-soft, var(--accent-soft));
  }
  .stub.active .dnum{color:var(--accent-city, var(--ink));}
  .stub.today::after{
    content:'HOJE';
    position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    font-size:7px; font-weight:700; letter-spacing:.05em;
    background:var(--accent-city, var(--ink)); color:var(--paper);
    padding:1px 5px; border-radius:6px; white-space:nowrap;
  }
  .today-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; font-weight:600; letter-spacing:.05em;
    color:var(--paper); background:var(--accent-city, var(--ink));
    padding:2px 8px; border-radius:6px; margin-left:8px;
    display:inline-block; vertical-align:middle;
  }

  .icsbtn{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.02em;
    font-weight:600;
    padding:7px 14px;
    border-radius:20px;
    border:1px solid var(--accent-city, var(--accent));
    background:var(--accent-city-soft, var(--accent-soft));
    color:var(--accent-city, var(--accent));
    cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
  }
  .icsbtn:hover{filter:brightness(0.95);}
  .icsbtn:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}

  main.day{padding:22px 18px 8px;}

  .pass{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 1px 3px rgba(43,36,32,0.06);
  }
  .pass-head{
    padding:20px 22px 16px;
    border-left:5px solid var(--accent-city, var(--accent));
    background: linear-gradient(90deg, var(--accent-city-soft, var(--accent-soft)) 0%, transparent 60%);
  }
  .pass-head .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--accent-city, var(--accent));
    font-weight:600;
    margin-bottom:6px;
  }
  .pass-head h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(20px,5vw,26px);
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  .hotel-line{
    display:flex; align-items:center; gap:8px;
    font-size:13.5px; color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 12px;
    width:fit-content;
  }
  .hotel-line b{font-weight:600;}
  .hotel-line .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  .perf{
    height:0;
    border-top:2px dashed var(--line-strong);
    position:relative;
    margin:0;
  }
  .perf::before,.perf::after{
    content:'';
    position:absolute; top:-9px;
    width:18px; height:18px;
    background:var(--paper);
    border-radius:50%;
  }
  .perf::before{left:-9px;}
  .perf::after{right:-9px;}

  .items{padding:6px 0 4px;}
  .item{
    display:grid;
    grid-template-columns:64px 1fr;
    gap:2px 14px;
    padding:13px 22px;
    border-bottom:1px solid var(--line);
    align-items:start;
    cursor:pointer;
  }
  .item:hover{background:var(--paper);}
  .item:focus-visible{outline:2px solid var(--ink); outline-offset:-2px;}
  .item:last-child{border-bottom:none;}
  .item .chev{
    display:inline-block;
    margin-left:6px;
    font-size:10px;
    color:var(--ink-soft);
    transition:transform .15s ease;
  }
  .item.expanded .chev{transform:rotate(90deg);}
  .item-links{
    grid-column:1 / -1;
    display:none;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .item.expanded .item-links{display:flex;}
  .item-links a{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    text-decoration:none;
    color:var(--accent-city, var(--accent));
    background:var(--accent-city-soft, var(--accent-soft));
    border:1px solid var(--accent-city, var(--accent));
    padding:5px 11px;
    border-radius:20px;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .item-links a:hover{filter:brightness(0.92);}
  .item-links .no-link{
    font-size:11.5px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .item .time{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:600;
    color:var(--accent-city, var(--accent));
    padding-top:1px;
  }
  .item .body .act{
    font-size:14.5px;
    font-weight:500;
    line-height:1.35;
  }
  .item .body .meta{
    display:flex;
    flex-wrap:wrap;
    gap:4px 10px;
    margin-top:5px;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .item .body .meta .m{
    display:inline-flex; align-items:center; gap:4px;
  }
  .item .body .meta .price{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    color:var(--ink);
    background:var(--paper-sunken);
    border:1px solid var(--line);
    padding:1px 7px;
    border-radius:20px;
  }
  .item .body .flag{
    display:inline-block;
    margin-top:6px;
    font-size:11px;
    font-weight:600;
    color:#8C4B12;
    background:#F4E3C7;
    padding:2px 8px;
    border-radius:6px;
  }
  .item.checkinout .act b{color:var(--accent-city, var(--accent));}
  .item.checkinout{background:var(--paper);}

  .foot-note{
    padding:16px 22px 20px;
    font-size:12.5px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
    display:flex; align-items:center; gap:8px;
  }

  .day-budget{
    padding:14px 22px 20px;
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .day-budget .db-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-soft);
  }
  .day-budget .db-value{
    font-family:'IBM Plex Mono', monospace;
    font-size:16px;
    font-weight:600;
    color:var(--accent-city, var(--accent));
  }
  .day-budget .db-note{
    font-size:10.5px;
    color:var(--ink-soft);
    display:block;
    margin-top:1px;
    font-family:'Inter',sans-serif;
    font-weight:400;
    text-transform:none;
    letter-spacing:normal;
  }

  .legend{
    display:flex; flex-wrap:wrap; gap:10px;
    padding:14px 18px 0;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
  }
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .legend i{width:8px; height:8px; border-radius:50%; display:inline-block;}

  footer.bud{
    margin:26px 18px 0;
    padding:18px 20px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper-raised);
  }
  footer.bud h3{
    font-family:'Fraunces', serif;
    font-size:17px; margin:0 0 10px;
  }
  footer.bud table{width:100%; border-collapse:collapse; font-size:13px;}
  footer.bud td{padding:6px 0; border-bottom:1px solid var(--line);}
  footer.bud td:last-child{text-align:right; font-family:'IBM Plex Mono', monospace;}
  footer.bud tr.total td{font-weight:700; border-bottom:none; padding-top:10px;}

  .summary-wrap{padding:4px 0;}
  .summary-intro{
    padding:4px 4px 16px;
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
  }
  .sday{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-left:5px solid var(--accent-city, var(--accent));
    border-radius:12px;
    padding:13px 16px;
    margin-bottom:8px;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .sday:hover{transform:translateX(2px);}
  .sday:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .sday .sd-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--accent-city, var(--accent));
    font-weight:600;
    width:52px;
    flex:0 0 auto;
    line-height:1.3;
  }
  .sday .sd-mid{flex:1 1 auto; min-width:0;}
  .sday .sd-title{font-size:14px; font-weight:600; line-height:1.3;}
  .sday .sd-hotel{font-size:11.5px; color:var(--ink-soft); margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sday .sd-price{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
    flex:0 0 auto;
    text-align:right;
    white-space:nowrap;
  }
  .sday .sd-price small{display:block; font-weight:400; font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="sub">Lua de Mel</div>
    <h1>Roteiro — Itália</h1>
    <div class="route">
      <span>Roma</span><span class="dot">→</span><span>Sorrento</span><span class="dot">→</span><span>Florença</span><span class="dot">→</span><span>Bologna</span><span class="dot">→</span><span>Veneza</span><span class="dot">→</span><span>Roma</span>
    </div>
  </header>

  <div class="viewtoggle">
    <button id="btnByDay" class="active">Por dia</button>
    <button id="btnSummary">Resumo</button>
  </div>

  <nav class="days" id="dayNav"></nav>

  <main class="day" id="dayView"></main>

  <div class="legend">
    <span><i style="background:#A8552E"></i>Roma</span>
    <span><i style="background:#2A6F63"></i>Sorrento</span>
    <span><i style="background:#B8862E"></i>Florença</span>

</div>

const TRIP_YEAR = 2027;
const STORAGE_KEY = 'roteiroItalia.state';

function dateForDay(day){
  const [dd, mm] = day.d.split('/').map(Number);
  return new Date(TRIP_YEAR, mm-1, dd);
}

function findTodayIndex(){
  const now = new Date();
  for(let i=0;i<DAYS.length;i++){
    const dd = dateForDay(DAYS[i]);
    if(dd.getFullYear()===now.getFullYear() && dd.getMonth()===now.getMonth() && dd.getDate()===now.getDate()) return i;
  }
  return -1;
}

let active = 0;
let mode = 'byday'; // 'byday' | 'summary'

function loadState(){
  const hash = location.hash.replace('#','');
  if(hash === 'resumo'){ mode = 'summary'; return; }
  const hm = hash.match(/^dia-(\d+)$/);
  if(hm){
    const idx = parseInt(hm[1],10) - 1;
    if(idx>=0 && idx<DAYS.length){ active = idx; mode = 'byday'; return; }
  }
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const st = JSON.parse(raw);
      if(typeof st.active === 'number' && st.active>=0 && st.active<DAYS.length) active = st.active;
      if(st.mode === 'summary' || st.mode === 'byday') mode = st.mode;
      return;
    }
  }catch(err){ /* localStorage indisponível — segue com o default */ }
  const todayIdx = findTodayIndex();
  if(todayIdx>=0) active = todayIdx;
}

function persistState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({active, mode})); }catch(err){ /* ignora se indisponível */ }
  try{ history.replaceState(null, '', mode==='summary' ? '#resumo' : '#dia-'+(active+1)); }catch(err){ /* ignora se indisponível */ }
}

function setMode(m){
  mode = m;
  document.getElementById('btnByDay').classList.toggle('active', m==='byday');
  document.getElementById('btnSummary').classList.toggle('active', m==='summary');
  document.getElementById('dayNav').style.display = (m==='byday') ? 'flex' : 'none';
  if(m==='byday'){ renderNav(); renderDay(); } else { renderSummary(); }
  persistState();
}
document.getElementById('btnByDay').onclick = ()=>setMode('byday');
document.getElementById('btnSummary').onclick = ()=>setMode('summary');

    card.addEventListener('click', open);
    card.addEventListener('keydown', function(e){
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); open(); }

    list.appendChild(card);
  });

function renderNav(){
  const nav = document.getElementById('dayNav');
  nav.innerHTML = '';
  const todayIdx = findTodayIndex();
  DAYS.forEach((day,i)=>{
    const col = CITY_COLORS[day.city];
    const btn = document.createElement('button');
    btn.className = 'stub' + (i===active ? ' active':'') + (i===todayIdx ? ' today':'');
    btn.style.setProperty('--accent-city', col.c);
    btn.style.setProperty('--accent-city-soft', col.soft);
    btn.setAttribute('aria-label', day.d+' '+day.wk+' '+day.title + (i===todayIdx ? ' (hoje)':''));
    btn.innerHTML = `<div class="dnum">${day.d.split('/')[0]}</div><div class="dwk">${day.wk.slice(0,3)}</div><div class="cdot"></div>`;
    btn.onclick = ()=>{active=i; renderNav(); renderDay(); persistState();};
    nav.appendChild(btn);
  });
  try{ nav.children[active].scrollIntoView({inline:'center', block:'nearest'}); }catch(err){ /* ambiente sem suporte a scrollIntoView com opções — ignora */ }
}

function mapsUrl(query){
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
}

function getMapsLinksFor(item, day){
  const links = [];
  const a = item.a || '';

  // Hotel: endereço exato
  if(a.includes('Check-in') || a.includes('Checkout')){
    for(const [name, addr] of Object.entries(HOTEL_ADDRESSES)){
      if(a.includes(name)) links.push({label:'📍 '+name+' no Maps', url: mapsUrl(addr)});
    }
    return links;
  }

  // Trecho de transporte "A → B": um pino pra cada ponta
  if(a.includes(' → ')){
    a.split(' → ').map(s=>s.trim()).forEach(place=>{
      links.push({label:'📍 '+place, url: mapsUrl(place+', Italy')});
    });
    return links;
  }

  // Ponto único: limpa prefixos comuns (Jantar —, Almoço —, etc.) antes de buscar
  let place = a
    .replace(/^Jantar( de Páscoa| de despedida)?\s*—?\s*/,'')
    .replace(/^Almoço\s*—?\s*(em|no)?\s*/,'')
    .replace(/^Café\/gelato\s*—\s*/,'')
    .replace(/^Test drive\s*—\s*/,'')
    .replace(/\s*\([^)]*\)\s*$/,'')
    .trim();

  if(place && place.toLowerCase() !== day.cityLabel.toLowerCase()){
    links.push({label:'📍 Ver no Google Maps', url: mapsUrl(place + ', ' + day.cityLabel)});
  }
  return links;
}

    ['Brunelleschi', 'https://duomo.firenze.it', 'Site oficial · Grande Museo del Duomo'],
    ['Accademia', 'https://www.gallerieaccademiafirenze.it', 'Site oficial · Galleria dell\'Accademia'],
    ['Uffizi', 'https://www.uffizi.it', 'Site oficial · Uffizi'],
    ["Torre dell'Orologio", 'https://www.bolognawelcome.com/it/esperienze/300685/Visita-alla-Torre-dell-Orologio-e-alle-Collezioni-Comunali-d-Arte', 'Reserva · Bologna Welcome'],
    ['Catedral de Siena', 'https://operaduomo.siena.it', 'Site oficial · OPA SI Pass'],
    ['Museu Casa Enzo Ferrari', 'https://www.ferrari.com/it-IT/museums/info-biglietti-visite-musei-ferrari', 'Bilheteria oficial · Museus Ferrari'],
    ['Galeria Ferrari', 'https://www.ferrari.com/it-IT/museums/info-biglietti-visite-musei-ferrari', 'Bilheteria oficial · Museus Ferrari'],
    ['Test drive', 'https://www.pushstart.it/pt/test-drive/ferrari-roma-spider/', 'Reserva · PushStart'],
    ['Basílica de São Marcos', 'https://www.sanmarco-venezia.it/it/tickets', 'Bilheteria oficial · Basílica São Marcos'],
    ['Campanário de São Marcos', 'https://www.sanmarco-venezia.it/it/tickets', 'Bilheteria oficial · Campanário'],
    ['Catedral de Amalfi', 'https://www.duomodiamalfi.it', 'Site oficial · Duomo di Amalfi']
  ];
  ATTRACTIONS.forEach(([key,url,label])=>{ if(a.includes(key)) links.push({label, url}); });

  if(tr.includes('Frecciarossa') || tr.includes('Leonardo Express') || tr.includes('Trenitalia')){
    links.push({label:'Comprar passagem · Trenitalia', url:'https://www.trenitalia.com'});
  }
  if(tr.includes('Italo')){
    links.push({label:'Comprar passagem · Italo', url:'https://www.italotreno.it'});
  }
  if(tr.includes('EAV') || tr.includes('Circumvesuviana')){
    links.push({label:'Site oficial · EAV', url:'https://www.eavsrl.it'});
  }
  if(tr.includes('SITA')){
    links.push({label:'Site oficial · SITA Sud', url:'https://www.sitasudtrasporti.it'});
  }
  if(tr.includes('Ferry')){
    links.push({label:'Ferry · Travelmar', url:'https://www.travelmar.it'});
  }

  return links;
}

function pad2(n){ return n<10 ? '0'+n : ''+n; }

function icsDate(d){
  return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'T'+pad2(d.getHours())+pad2(d.getMinutes())+'00';
}

function parseDurationMinutes(dur){
  if(!dur) return null;
  let m = dur.match(/(\d+)\s*h\s*(\d+)?/);
  if(m) return parseInt(m[1],10)*60 + (m[2] ? parseInt(m[2],10) : 0);
  m = dur.match(/(\d+)\s*min/);
  if(m) return parseInt(m[1],10);
  return null;
}

function parseItemTimes(day, item){
  const raw = (item.t || '').replace(/~/g,'').trim();
  const base = dateForDay(day);
  const range = raw.match(/^(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})$/);
  if(range){
    const start = new Date(base); start.setHours(+range[1], +range[2], 0, 0);
    const end = new Date(base); end.setHours(+range[3], +range[4], 0, 0);
    if(end <= start) end.setDate(end.getDate()+1);
    return {start, end};
  }
  const single = raw.match(/^(\d{1,2}):(\d{2})$/);
  if(single){
    const start = new Date(base); start.setHours(+single[1], +single[2], 0, 0);
    const end = new Date(start.getTime() + (parseDurationMinutes(item.dur) || 60) * 60000);
    return {start, end};
  }
  return null;
}

function icsEscape(s){
  return String(s || '').replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\n/g,'\\n');
}

function buildICS(days){
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Roteiro Italia//PT-BR//EN','CALSCALE:GREGORIAN'];
  const stamp = icsDate(new Date()) + 'Z';
  let count = 0;
  days.forEach(day=>{
    day.items.forEach(item=>{
      const times = parseItemTimes(day, item);
      if(!times) return;
      count++;
      const desc = [];
      if(item.tr && item.tr!=='—') desc.push('Transporte: '+item.tr);
      if(item.p && item.p!=='—') desc.push('Valor: '+item.p);
      if(item.flag) desc.push('Atenção: '+item.flag);
      lines.push('BEGIN:VEVENT');
      lines.push('UID:'+count+'-'+times.start.getTime()+'@roteiro-italia');
      lines.push('DTSTAMP:'+stamp);
      lines.push('DTSTART:'+icsDate(times.start));
      lines.push('DTEND:'+icsDate(times.end));
      lines.push('SUMMARY:'+icsEscape(item.a));
      if(desc.length) lines.push('DESCRIPTION:'+icsEscape(desc.join(' · ')));
      lines.push('LOCATION:'+icsEscape(day.cityLabel));
      lines.push('END:VEVENT');
    });
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

function downloadICS(content, filename){
  const blob = new Blob([content], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function exportDayICS(day){
  downloadICS(buildICS([day]), 'roteiro-'+day.d.replace('/','-')+'.ics');
}

function exportAllICS(){
  downloadICS(buildICS(DAYS), 'roteiro-italia-completo.ics');
}

function renderDay(){
  const day = DAYS[active];
  const col = CITY_COLORS[day.city];
  const view = document.getElementById('dayView');
  view.style.setProperty('--accent-city', col.c);
  view.style.setProperty('--accent-city-soft', col.soft);

  const isToday = findTodayIndex() === active;

  view.innerHTML = `
    <div class="pass">
      <div class="pass-head">
        <div class="eyebrow">${day.d} · ${day.wk}${isToday ? '<span class="today-badge">HOJE</span>' : ''}</div>
        <h2>${day.title}</h2>
        <div class="hotel-line">
          <span class="tag">${day.hotel ? 'Base':'Status'}</span>
          <span>${day.hotel ? day.hotel : day.hotelNote}</span>
        </div>
      </div>
      <div class="perf"></div>
      <div class="items" id="itemsList"></div>
      ${day.budget>0 ? `
      <div class="day-budget">
        <div>
          <div class="db-label">Gasto do dia</div>
          <div class="db-note">atrações + transporte + comida</div>
        </div>
        <div class="db-value">${fmtEUR(day.budget)}</div>
      </div>` : ''}
      <div class="foot-note">🌙 ${day.end}</div>
      <div class="foot-note" style="border-top:1px dashed var(--line);">
        <button type="button" class="icsbtn" id="exportDayBtn">📅 Exportar este dia (.ics)</button>
      </div>
    </div>
  `;

  document.getElementById('exportDayBtn').addEventListener('click', ()=>exportDayICS(day));

  const itemsList = document.getElementById('itemsList');
  day.items.forEach(it=>{
    const links = [...getLinksFor(it), ...getMapsLinksFor(it, day)];
    const row = document.createElement('div');
    row.className = 'item' + (it.ci ? ' checkinout' : '');
    row.tabIndex = 0;

    const timeEl = document.createElement('div');
    timeEl.className = 'time';
    timeEl.textContent = it.t;

    const bodyEl = document.createElement('div');
    bodyEl.className = 'body';

    const actEl = document.createElement('div');
    actEl.className = 'act';
    if(it.ci){
      const b = document.createElement('b');
      b.textContent = it.a;
      actEl.appendChild(b);
    } else {
      actEl.textContent = it.a;
    }
    if(links.length){
      const chev = document.createElement('span');
      chev.className = 'chev';
      chev.textContent = '▸';
      actEl.appendChild(chev);
    }

    const metaEl = document.createElement('div');
    metaEl.className = 'meta';
    if(it.dur && it.dur!=='—'){
      const s = document.createElement('span'); s.className='m'; s.textContent = '⏱ '+it.dur; metaEl.appendChild(s);
    }
    if(it.tr && it.tr!=='—'){
      const s = document.createElement('span'); s.className='m'; s.textContent = it.tr; metaEl.appendChild(s);
    }
    if(it.p && it.p!=='—'){
      const s = document.createElement('span'); s.className='price'; s.textContent = it.p; metaEl.appendChild(s);
    }

    bodyEl.appendChild(actEl);
    bodyEl.appendChild(metaEl);

    if(it.flag){
      const f = document.createElement('span');
      f.className = 'flag';
      f.textContent = it.flag;
      bodyEl.appendChild(f);
    }

    if(links.length){
      const linksEl = document.createElement('div');
      linksEl.className = 'item-links';
      links.forEach(l=>{
        const a = document.createElement('a');
        a.href = l.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = '↗ ' + l.label;
        a.addEventListener('click', (e)=> e.stopPropagation());
        linksEl.appendChild(a);
      });
      bodyEl.appendChild(linksEl);

      const toggle = ()=> row.classList.toggle('expanded');
      row.addEventListener('click', toggle);
      row.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggle(); } });
    } else {
      row.style.cursor = 'default';
    }

    row.appendChild(timeEl);
    row.appendChild(bodyEl);
    itemsList.appendChild(row);
  });
}
